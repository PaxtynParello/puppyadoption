<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Puppy Adoption Page!</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <form method="get"
    <label for="NAMESIGNUP">First Name:</label>
    <input type="text" id="NAMESIGNUP" name="NAMESIGNUP" placeholder="First Name">
    <label for="LASTNAMESIGNUP">Last Name:</label>
    <input type="text" id="LASTNAMESIGNUP" name="LASTNAMESIGNUP" placeholder="Last Name">
    <br>
    <br>
    <label for="EMAILSIGNUP">Email:</label>
    <input type="email" id="EMAILSIGNUP" name="EMAILSIGNUP" placeholder="Email">
    <label for="PASSWORDSIGNUP">Password:</label>
    <input type="password" id="PASSWORDSIGNUP" name="PASSWORDSIGNUP">
    <br>
    <p>Are you over the age of 18?</p>
    <label for="SIGNUPSELECTIONNO">No:</label>
    <input type="radio" id="SIGNUPSELECTIONNO" name="SIGNUPSELECTIONNO">
     <label for="SIGNUPSELECTIONYES">Yes:</label>
    <input type="radio" id="SIGNUPSELECTIONYES" name="SIGNUPSELECTIONYES">
    <label for="SELECTIONDROPDOWN">Do you have a Credit Card or Paypal?</label>"
    <select id="SELECTIONDROPDOWN" name="SELECTIONDROPDOWN">
        <option value="Credit Card">Credit Card</option>"
         <option value="Paypal">Paypal</option>"
    </select>
    <br>
    <input type="submit" value="submit">
    </form>
</body>
</html>
